public_url:
  type: str
  help: Externally reachable NEXTAUTH_URL used for authentication redirects.
  default: http://localhost:3000
  placeholder: https://karakeep.example.com
  when: << template == 'r-karakeep' >>
disable_signups:
  type: bool
  help: Enable after creating the accounts that should access the instance.
  default: false
  when: << template == 'r-karakeep' >>
rate_limiting_enabled:
  type: bool
  help: API Rate Limiting
  default: true
  when: << template == 'r-karakeep' >>
crawler_num_workers:
  type: int
  help: Concurrent crawling jobs. Higher values increase CPU and memory usage.
  default: 1
  when: << template == 'r-karakeep' >>
crawler_download_banner_image:
  type: bool
  help: Store Banner Images
  default: true
  when: << template == 'r-karakeep' >>
crawler_store_screenshot:
  type: bool
  help: Store Screenshots
  default: true
  when: << template == 'r-karakeep' >>
crawler_full_page_screenshot:
  type: bool
  help: Uses substantially more persistent storage.
  default: false
  when: << template == 'r-karakeep' >>
crawler_store_pdf:
  type: bool
  help: Uses additional persistent storage.
  default: false
  when: << template == 'r-karakeep' >>
crawler_full_page_archive:
  type: bool
  help: Store a complete local page copy rather than only readable text.
  default: false
  when: << template == 'r-karakeep' >>
ai_provider:
  type: str
  help: AI Provider
  default: none
  choices:
  - none
  - openai
  - ollama
  when: << template == 'r-karakeep' >>
openai_api_key:
  type: str
  help: OpenAI API Key
  default: ''
  secret: true
  when: << template == 'r-karakeep' and ai_provider == 'openai' >>
ollama_base_url:
  type: str
  help: Ollama Base URL
  default: http://host.docker.internal:11434
  placeholder: http://192.168.1.100:11434
  when: << template == 'r-karakeep' and ai_provider == 'ollama' >>
inference_text_model:
  type: str
  help: Use an installed Ollama model name when Ollama is selected.
  default: gpt-4.1-mini
  placeholder: gpt-4.1-mini
  when: << template == 'r-karakeep' and ai_provider in ['openai', 'ollama'] >>
inference_image_model:
  type: str
  help: For Ollama, use a model with vision support.
  default: gpt-4o-mini
  placeholder: gpt-4o-mini
  when: << template == 'r-karakeep' and ai_provider in ['openai', 'ollama'] >>
inference_language:
  type: str
  help: Inference Language
  default: english
  placeholder: english
  when: << template == 'r-karakeep' and ai_provider in ['openai', 'ollama'] >>
