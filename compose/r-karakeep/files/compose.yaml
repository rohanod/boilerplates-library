---
services:
  << service_name >>:
    image: ghcr.io/karakeep-app/karakeep:0.32.0
    restart: << restart_policy >>
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
      - MEILI_ADDR=http://<< service_name >>_meilisearch:7700
      - BROWSER_WEB_URL=http://<< service_name >>_chrome:9222
    volumes:
      <%- if volume_mode == 'mount' %>
      - << volume_mount_path >>/data:/data
      <%- else %>
      - << service_name >>_data:/data
      <%- endif %>
    networks:
      << service_name >>_backend:
      <%- if traefik_enabled %>
      << traefik_network >>:
      <%- endif %>
      <%- if npm_proxy_enabled %>
      npm-proxy:
        aliases:
          - karakeep-web
      <%- endif %>
    <%- if not traefik_enabled and not npm_proxy_enabled %>
    ports:
      - "<< ports_http >>:3000"
    <%- endif %>
    <%- if traefik_enabled %>
    labels:
      - traefik.enable=true
      - traefik.docker.network=<< traefik_network >>
      - traefik.http.services.<< service_name >>-web.loadBalancer.server.port=3000
      - traefik.http.routers.<< service_name >>-http.service=<< service_name >>-web
      - traefik.http.routers.<< service_name >>-http.rule=Host(`<< traefik_host >>.<< traefik_domain >>`)
      - traefik.http.routers.<< service_name >>-http.entrypoints=<< traefik_entrypoint >>
      <%- if traefik_tls_enabled %>
      - traefik.http.routers.<< service_name >>-https.service=<< service_name >>-web
      - traefik.http.routers.<< service_name >>-https.rule=Host(`<< traefik_host >>.<< traefik_domain >>`)
      - traefik.http.routers.<< service_name >>-https.entrypoints=<< traefik_tls_entrypoint >>
      - traefik.http.routers.<< service_name >>-https.tls=true
      - traefik.http.routers.<< service_name >>-https.tls.certresolver=<< traefik_tls_certresolver >>
      <%- endif %>
    <%- endif %>

  << service_name >>_chrome:
    image: gcr.io/zenika-hub/alpine-chrome:124
    restart: << restart_policy >>
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
    networks:
      - << service_name >>_backend

  << service_name >>_meilisearch:
    image: getmeili/meilisearch:v1.41.0
    restart: << restart_policy >>
    env_file:
      - .env
    environment:
      - MEILI_NO_ANALYTICS=true
    volumes:
      <%- if volume_mode == 'mount' %>
      - << volume_mount_path >>/meilisearch:/meili_data
      <%- else %>
      - << service_name >>_meilisearch:/meili_data
      <%- endif %>
    networks:
      - << service_name >>_backend

networks:
  << service_name >>_backend:
    driver: bridge
  <%- if traefik_enabled %>
  << traefik_network >>:
    external: true
  <%- endif %>
  <%- if npm_proxy_enabled %>
  npm-proxy:
    external: true
  <%- endif %>

<%- if volume_mode == 'local' %>
volumes:
  << service_name >>_data:
    driver: local
  << service_name >>_meilisearch:
    driver: local
<%- elif volume_mode == 'nfs' %>
volumes:
  << service_name >>_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=<< volume_nfs_server >>,nfsvers=4,<< volume_nfs_options >>
      device: ":<< volume_nfs_path >>/data"
  << service_name >>_meilisearch:
    driver: local
    driver_opts:
      type: nfs
      o: addr=<< volume_nfs_server >>,nfsvers=4,<< volume_nfs_options >>
      device: ":<< volume_nfs_path >>/meilisearch"
<%- endif %>
