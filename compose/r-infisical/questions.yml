infisical_site_url:
  type: str
  help: Site URL
  default: https://infisical.home.arpa
  placeholder: https://infisical.home.arpa
  when: << template == 'r-infisical' >>
database_connection_uri:
  type: str
  help: Full PostgreSQL connection URI for external databases. URL-encode special characters in usernames/passwords.
  default: ''
  placeholder: postgresql://infisical:password@postgres.example.internal:5432/infisical?sslmode=disable
  secret: true
  when: << template == 'r-infisical' and database_external >>
database_user:
  type: str
  help: Database User
  default: infisical
  placeholder: infisical
  when: << template == 'r-infisical' and not database_external >>
redis_external:
  type: bool
  help: External Redis
  default: false
  when: << template == 'r-infisical' >>
redis_url:
  type: str
  help: Full Redis URL for external Redis, for example redis://:password@redis.example.internal:6379.
  default: ''
  placeholder: redis://:password@redis.example.internal:6379
  secret: true
  when: << template == 'r-infisical' and redis_external >>
email_enabled:
  type: bool
  help: SMTP Email
  default: false
  when: << template == 'r-infisical' >>
email_host:
  type: str
  help: SMTP Host
  default: smtp.home.arpa
  placeholder: smtp.home.arpa
  when: << template == 'r-infisical' and email_enabled >>
email_port:
  type: int
  help: SMTP Port
  default: 587
  placeholder: '587'
  when: << template == 'r-infisical' and email_enabled >>
email_from_address:
  type: str
  help: From Address
  default: infisical@home.arpa
  placeholder: infisical@home.arpa
  when: << template == 'r-infisical' and email_enabled >>
email_from_name:
  type: str
  help: From Name
  default: Infisical
  placeholder: Infisical
  when: << template == 'r-infisical' and email_enabled >>
email_username:
  type: str
  help: SMTP Username
  default: ''
  placeholder: user@example.com
  when: << template == 'r-infisical' and email_enabled >>
email_password:
  type: str
  help: SMTP Password
  default: ''
  secret: true
  when: << template == 'r-infisical' and email_enabled >>
email_secure:
  type: bool
  help: SMTP Secure
  default: false
  when: << template == 'r-infisical' and email_enabled >>
email_require_tls:
  type: bool
  help: Require TLS
  default: true
  when: << template == 'r-infisical' and email_enabled >>
email_ignore_tls:
  type: bool
  help: Ignore TLS
  default: false
  when: << template == 'r-infisical' and email_enabled >>
