stop_grace_period:
  type: str
  help: Stop Grace Period
  default: 30s
  placeholder: 30s
  when: << template == 'r-bambuddy' >>
debug_enabled:
  type: bool
  help: Debug Logging
  default: false
  when: << template == 'r-bambuddy' >>
application_port:
  type: int
  help: Port BamBuddy listens on. In host mode this is the host port.
  default: 8000
  placeholder: '8000'
  when: << template == 'r-bambuddy' >>
ports_web:
  type: str
  help: Web UI Host Port
  default: '8000'
  placeholder: '8000'
  when: << template == 'r-bambuddy' and network_mode == 'bridge' and not npm_proxy_enabled >>
virtual_printer_enabled:
  type: bool
  help: Publish the official virtual-printer port set for up to three virtual printers.
  default: false
  when: << template == 'r-bambuddy' and network_mode == 'bridge' >>
virtual_printer_pasv_address:
  type: str
  help: LAN IP of the Docker host advertised to FTP clients.
  default: 192.168.1.100
  placeholder: 192.168.1.100
  when: << template == 'r-bambuddy' and network_mode == 'bridge' and virtual_printer_enabled >>
home_assistant_enabled:
  type: bool
  help: Home Assistant
  default: false
  when: << template == 'r-bambuddy' >>
home_assistant_url:
  type: str
  help: Home Assistant URL
  default: http://homeassistant.local:8123
  placeholder: http://homeassistant.local:8123
  when: << template == 'r-bambuddy' and home_assistant_enabled >>
home_assistant_token:
  type: str
  help: Long-Lived Access Token
  default: ''
  secret: true
  when: << template == 'r-bambuddy' and home_assistant_enabled >>
trusted_frame_origins:
  type: str
  help: Comma-separated exact origins allowed to embed BamBuddy, such as a Home Assistant URL.
  default: ''
  placeholder: https://homeassistant.example.com
  when: << template == 'r-bambuddy' >>
external_database_enabled:
  type: bool
  help: Use an existing PostgreSQL server instead of the default SQLite database.
  default: false
  when: << template == 'r-bambuddy' >>
database_url:
  type: str
  help: SQLAlchemy URL, for example postgresql+asyncpg://user:password@host:5432/bambuddy.
  default: ''
  secret: true
  when: << template == 'r-bambuddy' and external_database_enabled >>
slicer_api_url:
  type: str
  help: Optional URL of a separately deployed OrcaSlicer API service.
  default: ''
  placeholder: http://192.168.1.100:3003
  when: << template == 'r-bambuddy' >>
external_library_enabled:
  type: bool
  help: External File Library
  default: false
  when: << template == 'r-bambuddy' >>
external_library_host_path:
  type: str
  help: Host Library Path
  default: /mnt/nas/3d-prints
  placeholder: /mnt/nas/3d-prints
  when: << template == 'r-bambuddy' and external_library_enabled >>
external_library_container_path:
  type: str
  help: Absolute in-container path added to BAMBUDDY_EXTERNAL_ROOTS.
  default: /external/library
  placeholder: /external/library
  when: << template == 'r-bambuddy' and external_library_enabled >>
