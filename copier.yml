_min_copier_version: "9.17.0"
_subdirectory: "boilerplates/<< template >>/files"
_templates_suffix: ""

_envops:
  variable_start_string: "<<"
  variable_end_string: ">>"
  block_start_string: "<%"
  block_end_string: "%>"
  comment_start_string: "<#"
  comment_end_string: "#>"
  keep_trailing_newline: true

_exclude:
  - .DS_Store
  - ._*

_skip_if_exists:
  - .env

_tasks:
  - command:
      - bash
      - -c
      - |
        set -euo pipefail

        ensure_env_ignored() {
          touch .gitignore
          grep -qxF .env .gitignore || printf '.env\n' >> .gitignore
        }

        replace_token() {
          local token="$1"
          local value="$2"
          local temporary

          [[ -f .env ]] || return 0
          grep -qF "$token" .env || return 0

          temporary="$(mktemp)"
          TOKEN="$token" VALUE="$value" awk '{ gsub(ENVIRON["TOKEN"], ENVIRON["VALUE"]); print }' .env > "$temporary"
          mv "$temporary" .env
        }

        ensure_env_ignored

        case "<< template >>" in
          cloudflared-web)
            replace_token __COPIER_BASIC_AUTH_PASSWORD__ "$(openssl rand -hex 12)"
            ;;
          infisical)
            replace_token __COPIER_INFISICAL_ENCRYPTION_KEY__ "$(openssl rand -hex 16)"
            replace_token __COPIER_INFISICAL_AUTH_SECRET__ "$(openssl rand -base64 32 | tr -d '\n')"
            replace_token __COPIER_POSTGRES_PASSWORD__ "$(openssl rand -hex 16)"
            replace_token __COPIER_REDIS_PASSWORD__ "$(openssl rand -hex 16)"
            ;;
          karakeep)
            replace_token __COPIER_NEXTAUTH_SECRET__ "$(openssl rand -base64 36 | tr -d '\n')"
            replace_token __COPIER_MEILI_MASTER_KEY__ "$(openssl rand -hex 24)"
            ;;
        esac
    when: "<< _copier_operation == 'copy' and template in ['bambuddy', 'cloudflared-web', 'infisical', 'karakeep', 'spoolman', 'tinyauth'] >>"

template:
  type: str
  help: Docker Compose template to generate.
  choices:
    BamBuddy: bambuddy
    changedetection.io: changedetection
    Cloudflared Web: cloudflared-web
    Infisical: infisical
    Karakeep: karakeep
    Nginx Proxy Manager: nginxproxymanager
    Spoolman: spoolman
    TinyAuth: tinyauth
service_name:
  type: str
  help: Service Name
  default: '<< {''bambuddy'': ''bambuddy'', ''changedetection'': ''changedetection'', ''cloudflared-web'': ''cloudflared-web'', ''infisical'': '''', ''karakeep'': ''karakeep'', ''nginxproxymanager'': ''nginxproxymanager'', ''spoolman'': ''spoolman'', ''tinyauth'': ''tinyauth''}.get(template, '''') >>'
  placeholder: '<< {''bambuddy'': ''bambuddy'', ''changedetection'': ''changedetection'', ''cloudflared-web'': ''cloudflared-web'', ''infisical'': ''infisical'', ''karakeep'': ''karakeep'', ''nginxproxymanager'': ''nginxproxymanager'', ''spoolman'': ''spoolman'', ''tinyauth'': ''tinyauth''}.get(template, '''') >>'
container_name:
  type: str
  help: Leave empty to let Docker Compose generate the container name.
  default: '<< {''bambuddy'': ''bambuddy'', ''cloudflared-web'': ''cloudflared-web'', ''infisical'': ''''}.get(template, '''') >>'
  placeholder: '<< {''bambuddy'': ''bambuddy'', ''cloudflared-web'': ''cloudflared-web'', ''infisical'': ''infisical''}.get(template, '''') >>'
  when: << (template == 'bambuddy') or (template == 'cloudflared-web') or (template == 'infisical') >>
container_timezone:
  type: str
  help: Container Timezone
  default: Europe/Zurich
  placeholder: Europe/Zurich
  when: << (template == 'bambuddy') or (template == 'changedetection') or (template == 'nginxproxymanager') or (template == 'spoolman') >>
puid:
  type: int
  help: UID used for files written to persistent storage.
  default: 1000
  when: << (template == 'bambuddy') or (template == 'spoolman') >>
pgid:
  type: int
  help: GID used for files written to persistent storage.
  default: 1000
  when: << (template == 'bambuddy') or (template == 'spoolman') >>
restart_policy:
  type: str
  help: Restart Policy
  default: unless-stopped
  choices:
  - unless-stopped
  - always
  - on-failure
  - 'no'
log_level:
  type: str
  help: Log Level
  default: '<< {''bambuddy'': ''INFO'', ''karakeep'': ''info''}.get(template, '''') >>'
  choices: '<< {''bambuddy'': [''DEBUG'', ''INFO'', ''WARNING'', ''ERROR''], ''karakeep'': [''debug'', ''info'', ''notice'', ''warning'', ''error'']}.get(template, []) >>'
  when: << (template == 'bambuddy') or (template == 'karakeep') >>
network_mode:
  type: str
  help: Host mode enables automatic LAN printer discovery on Linux. Bridge mode is required on Docker Desktop and usually requires adding printers manually by IP.
  default: host
  choices:
  - host
  - bridge
  when: << (template == 'bambuddy') >>
traefik_enabled:
  type: bool
  help: Attach to an external Traefik network and create routing labels.
  default: '<< {''changedetection'': False, ''infisical'': True, ''karakeep'': False, ''nginxproxymanager'': False, ''spoolman'': False, ''tinyauth'': False}.get(template, False) >>'
  when: << (template == 'changedetection') or (template == 'infisical') or (template == 'karakeep') or (template == 'nginxproxymanager') or (template == 'spoolman') or (template == 'tinyauth') >>
npm_proxy_enabled:
  type: bool
  help: >-
    << 'Attach Nginx Proxy Manager to the existing external npm-proxy network so it can reach proxied containers.'
       if template == 'nginxproxymanager'
       else 'Attach this container to the existing external npm-proxy network and suppress only its Web UI host port.' >>
  default: false
  when: << (template == 'bambuddy' and network_mode == 'bridge') or (template == 'changedetection') or (template == 'infisical') or (template == 'karakeep') or (template == 'nginxproxymanager') or (template == 'spoolman') or (template == 'tinyauth') >>
ports_http:
  type: str
  help: Host port exposed when Traefik and Nginx Proxy Manager integrations are disabled.
  default: '<< {''changedetection'': ''5000'', ''infisical'': ''8080'', ''karakeep'': ''3000'', ''nginxproxymanager'': ''80'', ''spoolman'': ''7912'', ''tinyauth'': ''3000''}.get(template, '''') >>'
  placeholder: '<< {''changedetection'': ''5000'', ''infisical'': ''8080'', ''karakeep'': ''3000'', ''nginxproxymanager'': ''80'', ''spoolman'': ''7912'', ''tinyauth'': ''3000''}.get(template, '''') >>'
  when: << (template == 'changedetection' and not traefik_enabled and not npm_proxy_enabled) or (template == 'infisical' and not traefik_enabled and not npm_proxy_enabled) or (template == 'karakeep' and not traefik_enabled and not npm_proxy_enabled) or (template == 'nginxproxymanager') or (template == 'spoolman' and not traefik_enabled and not npm_proxy_enabled) or (template == 'tinyauth' and not traefik_enabled and not npm_proxy_enabled) >>
traefik_host:
  type: str
  help: Host
  default: '<< {''changedetection'': ''changedetection'', ''infisical'': ''infisical'', ''karakeep'': ''karakeep'', ''nginxproxymanager'': ''npm'', ''spoolman'': ''spoolman'', ''tinyauth'': ''auth''}.get(template, '''') >>'
  placeholder: '<< {''changedetection'': ''changedetection'', ''infisical'': ''infisical'', ''karakeep'': ''karakeep'', ''nginxproxymanager'': ''npm'', ''spoolman'': ''spoolman'', ''tinyauth'': ''auth''}.get(template, '''') >>'
  when: << (template == 'changedetection' and traefik_enabled) or (template == 'infisical' and traefik_enabled) or (template == 'karakeep' and traefik_enabled) or (template == 'nginxproxymanager' and traefik_enabled) or (template == 'spoolman' and traefik_enabled) or (template == 'tinyauth' and traefik_enabled) >>
traefik_domain:
  type: str
  help: Domain
  default: home.arpa
  placeholder: home.arpa
  when: << (template == 'changedetection' and traefik_enabled) or (template == 'infisical' and traefik_enabled) or (template == 'karakeep' and traefik_enabled) or (template == 'nginxproxymanager' and traefik_enabled) or (template == 'spoolman' and traefik_enabled) or (template == 'tinyauth' and traefik_enabled) >>
traefik_entrypoint:
  type: str
  help: Entrypoint
  default: web
  placeholder: web
  when: << (template == 'changedetection' and traefik_enabled) or (template == 'infisical' and traefik_enabled) or (template == 'karakeep' and traefik_enabled) or (template == 'nginxproxymanager' and traefik_enabled) or (template == 'spoolman' and traefik_enabled) or (template == 'tinyauth' and traefik_enabled) >>
traefik_network:
  type: str
  help: Network
  default: traefik
  placeholder: traefik
  when: << (template == 'changedetection' and traefik_enabled) or (template == 'infisical' and traefik_enabled) or (template == 'karakeep' and traefik_enabled) or (template == 'nginxproxymanager' and traefik_enabled) or (template == 'spoolman' and traefik_enabled) or (template == 'tinyauth' and traefik_enabled) >>
traefik_tls_enabled:
  type: bool
  help: TLS
  default: '<< {''changedetection'': False, ''infisical'': True, ''karakeep'': False, ''nginxproxymanager'': False, ''spoolman'': False, ''tinyauth'': False}.get(template, False) >>'
  when: << (template == 'changedetection' and traefik_enabled) or (template == 'infisical' and traefik_enabled) or (template == 'karakeep' and traefik_enabled) or (template == 'nginxproxymanager' and traefik_enabled) or (template == 'spoolman' and traefik_enabled) or (template == 'tinyauth' and traefik_enabled) >>
traefik_tls_entrypoint:
  type: str
  help: TLS Entrypoint
  default: websecure
  placeholder: websecure
  when: << (template == 'changedetection' and traefik_enabled and traefik_tls_enabled) or (template == 'infisical' and traefik_enabled and traefik_tls_enabled) or (template == 'karakeep' and traefik_enabled and traefik_tls_enabled) or (template == 'nginxproxymanager' and traefik_enabled and traefik_tls_enabled) or (template == 'spoolman' and traefik_enabled and traefik_tls_enabled) or (template == 'tinyauth' and traefik_enabled and traefik_tls_enabled) >>
traefik_tls_certresolver:
  type: str
  help: Cert Resolver
  default: cloudflare
  placeholder: cloudflare
  when: << (template == 'changedetection' and traefik_enabled and traefik_tls_enabled) or (template == 'infisical' and traefik_enabled and traefik_tls_enabled) or (template == 'karakeep' and traefik_enabled and traefik_tls_enabled) or (template == 'nginxproxymanager' and traefik_enabled and traefik_tls_enabled) or (template == 'spoolman' and traefik_enabled and traefik_tls_enabled) or (template == 'tinyauth' and traefik_enabled and traefik_tls_enabled) >>
metrics_enabled:
  type: bool
  help: Tunnel Metrics
  default: false
  when: << (template == 'cloudflared-web') or (template == 'spoolman') >>
volume_mode:
  type: str
  help: Choose where this stack keeps persistent data.
  default: mount
  choices:
    Docker-managed named volumes: local
    Host bind mounts: mount
    NFS-backed named volumes: nfs
volume_mount_path:
  type: str
  help: Host directory for this stack. Multi-volume stacks create subdirectories below it.
  default: '../data/<< container_name or service_name or template >>'
  placeholder: '../data/<< container_name or service_name or template >>'
  when: << (template == 'bambuddy' and volume_mode == 'mount') or (template == 'changedetection' and volume_mode == 'mount') or (template == 'cloudflared-web' and volume_mode == 'mount') or (template == 'infisical' and volume_mode == 'mount') or (template == 'karakeep' and volume_mode == 'mount') or (template == 'nginxproxymanager' and volume_mode == 'mount') or (template == 'spoolman' and volume_mode == 'mount') or (template == 'tinyauth' and volume_mode == 'mount') >>
volume_nfs_server:
  type: str
  help: NFS server hostname or IP address.
  default: NFS_SERVER
  placeholder: NFS_SERVER
  when: << (template == 'bambuddy' and volume_mode == 'nfs') or (template == 'changedetection' and volume_mode == 'nfs') or (template == 'cloudflared-web' and volume_mode == 'nfs') or (template == 'infisical' and volume_mode == 'nfs') or (template == 'karakeep' and volume_mode == 'nfs') or (template == 'nginxproxymanager' and volume_mode == 'nfs') or (template == 'spoolman' and volume_mode == 'nfs') or (template == 'tinyauth' and volume_mode == 'nfs') >>
volume_nfs_path:
  type: str
  help: Root NFS export path for this stack. Multi-volume stacks use subdirectories below it.
  default: '<< {''bambuddy'': ''/export/bambuddy'', ''changedetection'': ''/export/changedetection'', ''cloudflared-web'': ''/export/cloudflared-web'', ''infisical'': ''/export/infisical'', ''karakeep'': ''/export/karakeep'', ''nginxproxymanager'': ''/export/nginxproxymanager'', ''spoolman'': ''/export/spoolman'', ''tinyauth'': ''/export/tinyauth''}.get(template, '''') >>'
  placeholder: '<< {''bambuddy'': ''/export/bambuddy'', ''changedetection'': ''/export/changedetection'', ''cloudflared-web'': ''/export/cloudflared-web'', ''infisical'': ''/export/infisical'', ''karakeep'': ''/export/karakeep'', ''nginxproxymanager'': ''/export/nginxproxymanager'', ''spoolman'': ''/export/spoolman'', ''tinyauth'': ''/export/tinyauth''}.get(template, '''') >>'
  when: << (template == 'bambuddy' and volume_mode == 'nfs') or (template == 'changedetection' and volume_mode == 'nfs') or (template == 'cloudflared-web' and volume_mode == 'nfs') or (template == 'infisical' and volume_mode == 'nfs') or (template == 'karakeep' and volume_mode == 'nfs') or (template == 'nginxproxymanager' and volume_mode == 'nfs') or (template == 'spoolman' and volume_mode == 'nfs') or (template == 'tinyauth' and volume_mode == 'nfs') >>
volume_nfs_options:
  type: str
  help: Additional comma-separated NFS mount options.
  default: rw,nolock,soft
  placeholder: rw,nolock,soft
  when: << (template == 'bambuddy' and volume_mode == 'nfs') or (template == 'changedetection' and volume_mode == 'nfs') or (template == 'cloudflared-web' and volume_mode == 'nfs') or (template == 'infisical' and volume_mode == 'nfs') or (template == 'karakeep' and volume_mode == 'nfs') or (template == 'nginxproxymanager' and volume_mode == 'nfs') or (template == 'spoolman' and volume_mode == 'nfs') or (template == 'tinyauth' and volume_mode == 'nfs') >>
database_external:
  type: bool
  help: External PostgreSQL
  default: false
  when: << (template == 'infisical') >>
database_type:
  type: str
  help: Database Type
  default: sqlite
  choices:
  - sqlite
  - postgresql
  - mysql
  - cockroachdb
  when: << (template == 'spoolman') >>
database_password:
  type: str
  help: Database Password
  default: ''
  when: << (template == 'spoolman' and database_type != 'sqlite') >>
  secret: true
database_name:
  type: str
  help: Database Name
  default: '<< {''infisical'': ''infisical'', ''spoolman'': ''spoolman''}.get(template, '''') >>'
  placeholder: '<< {''infisical'': ''infisical'', ''spoolman'': ''spoolman''}.get(template, '''') >>'
  when: << (template == 'infisical' and not database_external) or (template == 'spoolman' and database_type != 'sqlite') >>
---
!include boilerplates/bambuddy/questions.yml
---
!include boilerplates/changedetection/questions.yml
---
!include boilerplates/cloudflared-web/questions.yml
---
!include boilerplates/infisical/questions.yml
---
!include boilerplates/karakeep/questions.yml
---
!include boilerplates/nginxproxymanager/questions.yml
---
!include boilerplates/spoolman/questions.yml
---
!include boilerplates/tinyauth/questions.yml
