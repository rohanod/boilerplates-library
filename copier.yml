_min_copier_version: "9.17.0"
_subdirectory: "boilerplates/<< template >>/files"
_templates_suffix: ""

_envops:
  variable_start_string: "<<"
  variable_end_string: ">>"
  block_start_string: "<%"
  block_end_string: "%>"
  comment_start_string: "<#"
  comment_end_string: "#>"
  keep_trailing_newline: true

_exclude:
  - .DS_Store
  - ._*

_skip_if_exists:
  - .env

_tasks:
  - command:
      - bash
      - -c
      - |
        set -euo pipefail

        ensure_env_ignored() {
          touch .gitignore
          grep -qxF .env .gitignore || printf '.env\n' >> .gitignore
        }

        replace_token() {
          local token="$1"
          local value="$2"
          local temporary

          [[ -f .env ]] || return 0
          grep -qF "$token" .env || return 0

          temporary="$(mktemp)"
          TOKEN="$token" VALUE="$value" awk '{ gsub(ENVIRON["TOKEN"], ENVIRON["VALUE"]); print }' .env > "$temporary"
          mv "$temporary" .env
        }

        ensure_env_ignored

        case "<< template >>" in
          cloudflared-web)
            replace_token __COPIER_BASIC_AUTH_PASSWORD__ "$(openssl rand -hex 12)"
            ;;
          karakeep)
            replace_token __COPIER_NEXTAUTH_SECRET__ "$(openssl rand -base64 36 | tr -d '\n')"
            replace_token __COPIER_MEILI_MASTER_KEY__ "$(openssl rand -hex 24)"
            ;;
        esac
    when: << _copier_operation == 'copy' and template in ['bambuddy', 'changedetection', 'cloudflared-web', 'karakeep', 'nginxproxymanager', 'spoolman', 'tinyauth'] >>

template:
  type: str
  help: Docker Compose template to generate.
  choices:
    BamBuddy: bambuddy
    changedetection.io: changedetection
    Cloudflared Web: cloudflared-web
    Karakeep: karakeep
    Nginx Proxy Manager: nginxproxymanager
    Spoolman: spoolman
    TinyAuth: tinyauth

service_name:
  type: str
  help: Docker Compose service name.
  default: '<< {''bambuddy'': ''bambuddy'', ''changedetection'': ''changedetection'', ''cloudflared-web'': ''cloudflared-web'', ''karakeep'': ''karakeep'', ''nginxproxymanager'': ''nginxproxymanager'', ''spoolman'': ''spoolman'', ''tinyauth'': ''tinyauth''}.get(template, '''') >>'
  placeholder: '<< {''bambuddy'': ''bambuddy'', ''changedetection'': ''changedetection'', ''cloudflared-web'': ''cloudflared-web'', ''karakeep'': ''karakeep'', ''nginxproxymanager'': ''nginxproxymanager'', ''spoolman'': ''spoolman'', ''tinyauth'': ''tinyauth''}.get(template, '''') >>'

container_name:
  type: str
  help: Leave empty to let Docker Compose generate the container name.
  default: '<< {''bambuddy'': ''bambuddy'', ''cloudflared-web'': ''cloudflared-web''}.get(template, '''') >>'
  placeholder: '<< {''bambuddy'': ''bambuddy'', ''cloudflared-web'': ''cloudflared-web''}.get(template, '''') >>'
  when: << template in ['bambuddy', 'cloudflared-web'] >>

volume_mode:
  type: str
  help: Choose where this stack keeps persistent data. ../data is relative to the destination directory you chose, not where you ran Copier.
  default: mount
  choices:
    Docker-managed named volumes: local
    Host bind mounts in ../data from the destination directory: mount
    NFS-backed named volumes: nfs

volume_mount_path:
  type: str
  help: Host directory for this stack. Multi-volume stacks create subdirectories below it.
  default: '../data/<< container_name or service_name or template >>'
  placeholder: '../data/<< container_name or service_name or template >>'
  when: << volume_mode == 'mount' >>

volume_nfs_server:
  type: str
  help: NFS server hostname or IP address.
  default: NFS_SERVER
  placeholder: NFS_SERVER
  when: << volume_mode == 'nfs' >>

volume_nfs_path:
  type: str
  help: Root NFS export path for this stack. Multi-volume stacks use subdirectories below it.
  default: '/export/<< container_name or service_name or template >>'
  placeholder: '/export/<< container_name or service_name or template >>'
  when: << volume_mode == 'nfs' >>

volume_nfs_options:
  type: str
  help: Additional comma-separated NFS mount options.
  default: rw,nolock,soft
  placeholder: rw,nolock,soft
  when: << volume_mode == 'nfs' >>

network_mode:
  type: str
  help: Host mode enables automatic LAN printer discovery on Linux. Bridge mode is required on Docker Desktop and for NPM proxying.
  default: host
  choices:
    Host networking with automatic discovery: host
    Bridge networking with explicit ports: bridge
  when: << template == 'bambuddy' >>

---
!include boilerplates/bambuddy/questions.yml
---
!include boilerplates/changedetection/questions.yml
---
!include boilerplates/cloudflared-web/questions.yml
---
!include boilerplates/karakeep/questions.yml
---
!include boilerplates/nginxproxymanager/questions.yml
---
!include boilerplates/spoolman/questions.yml
---
!include boilerplates/tinyauth/questions.yml
---
configure_optional:
  type: bool
  help: 'Configure optional << {''bambuddy'': ''BamBuddy'', ''changedetection'': ''changedetection.io'', ''cloudflared-web'': ''Cloudflared Web'', ''karakeep'': ''Karakeep'', ''nginxproxymanager'': ''Nginx Proxy Manager'', ''spoolman'': ''Spoolman'', ''tinyauth'': ''TinyAuth''}[template] >> settings?'
  default: false

optional_groups:
  type: str
  help: Select every optional configuration group you want to review.
  multiselect: true
  default: []
  choices: |
    <% if template == 'bambuddy' %>
    Runtime and networking: runtime
    <% if network_mode == 'bridge' %>
    Nginx Proxy Manager: npm_proxy
    <% endif %>
    Home Assistant: home_assistant
    External PostgreSQL: database
    OrcaSlicer API: slicer
    External libraries: libraries
    Certificates and backups: certificates_backups
    <% elif template == 'changedetection' %>
    Nginx Proxy Manager: npm_proxy
    Public URL and privacy: public_privacy
    JavaScript browser: browser
    Outbound proxy: outbound_proxy
    Fetch tuning: fetch
    <% elif template == 'cloudflared-web' %>
    Web UI authentication: webui_auth
    Tunnel connection: tunnel
    Metrics: metrics
    <% elif template == 'karakeep' %>
    Nginx Proxy Manager: npm_proxy
    Access and crawling: crawler
    Artificial intelligence: ai
    OpenID Connect: oidc
    Email: email
    S3-compatible storage: s3
    Database and storage tuning: storage_tuning
    <% elif template == 'nginxproxymanager' %>
    Proxy network attachment: npm_proxy
    External database: database
    Initial administrator: initial_admin
    Network and embedding: network_behavior
    Custom Nginx configuration: custom_config
    <% elif template == 'spoolman' %>
    Nginx Proxy Manager: npm_proxy
    External database: database
    Access controls: access
    Logging and metrics: observability
    Material catalog: catalog
    SQLite backups: backups
    <% elif template == 'tinyauth' %>
    Nginx Proxy Manager: npm_proxy
    Session and access policy: session_access
    OAuth tuning: oauth
    LDAP tuning: ldap
    User interface: ui
    Privacy and logging: privacy_logging
    <% endif %>
  when: << configure_optional >>

npm_proxy_enabled:
  type: bool
  default: "<< 'npm_proxy' in optional_groups >>"
  when: false

npm_proxy_network:
  type: str
  help: Existing external Docker network shared by Nginx Proxy Manager and proxied applications.
  default: npm-proxy
  placeholder: npm-proxy
  when: << npm_proxy_enabled >>

restart_policy:
  type: str
  help: Docker restart policy.
  default: unless-stopped
  choices:
    - unless-stopped
    - always
    - on-failure
    - 'no'
  when: >-
    << configure_optional and (
      (template == 'bambuddy' and 'runtime' in optional_groups) or
      (template == 'cloudflared-web' and 'tunnel' in optional_groups) or
      (template == 'nginxproxymanager' and 'network_behavior' in optional_groups) or
      (template == 'spoolman' and 'observability' in optional_groups)
    ) >>

container_timezone:
  type: str
  help: IANA timezone used inside the container.
  default: Europe/Zurich
  placeholder: Europe/Zurich
  when: >-
    << configure_optional and (
      (template == 'bambuddy' and 'runtime' in optional_groups) or
      (template == 'changedetection' and 'public_privacy' in optional_groups) or
      (template == 'nginxproxymanager' and 'network_behavior' in optional_groups) or
      (template == 'spoolman' and 'observability' in optional_groups)
    ) >>

puid:
  type: int
  help: UID used for files written to persistent storage.
  default: 1000
  when: << configure_optional and ((template == 'bambuddy' and 'runtime' in optional_groups) or (template == 'spoolman' and 'observability' in optional_groups)) >>

pgid:
  type: int
  help: GID used for files written to persistent storage.
  default: 1000
  when: << configure_optional and ((template == 'bambuddy' and 'runtime' in optional_groups) or (template == 'spoolman' and 'observability' in optional_groups)) >>

log_level:
  type: str
  help: Application log level.
  default: '<< {''bambuddy'': ''INFO'', ''karakeep'': ''info'', ''tinyauth'': ''info''}.get(template, ''info'') >>'
  choices: '<< {''bambuddy'': [''DEBUG'', ''INFO'', ''WARNING'', ''ERROR''], ''karakeep'': [''debug'', ''info'', ''notice'', ''warning'', ''error''], ''tinyauth'': [''debug'', ''info'', ''warn'', ''error'']}.get(template, []) >>'
  when: >-
    << configure_optional and (
      (template == 'bambuddy' and 'runtime' in optional_groups) or
      (template == 'karakeep' and 'crawler' in optional_groups) or
      (template == 'tinyauth' and 'privacy_logging' in optional_groups)
    ) >>

metrics_enabled:
  type: bool
  help: Expose application metrics.
  default: false
  when: << configure_optional and ((template == 'cloudflared-web' and 'metrics' in optional_groups) or (template == 'spoolman' and 'observability' in optional_groups)) >>

email_enabled:
  type: bool
  help: Configure SMTP email delivery.
  default: false
  when: << template == 'karakeep' and configure_optional and 'email' in optional_groups >>

database_type:
  type: str
  help: Database engine.
  default: sqlite
  choices:
    SQLite: sqlite
    PostgreSQL: postgres
    MySQL: mysql
    CockroachDB: cockroachdb
  when: << template == 'spoolman' and configure_optional and 'database' in optional_groups >>

database_name:
  type: str
  help: Application database name.
  default: spoolman
  when: << template == 'spoolman' and configure_optional and 'database' in optional_groups and database_type != 'sqlite' >>

ports_http:
  type: str
  help: Direct host port for the Web UI when Nginx Proxy Manager integration is not selected.
  default: '<< {''changedetection'': ''5000'', ''karakeep'': ''3000'', ''nginxproxymanager'': ''80'', ''spoolman'': ''7912'', ''tinyauth'': ''3000''}.get(template, '''') >>'
  placeholder: '<< {''changedetection'': ''5000'', ''karakeep'': ''3000'', ''nginxproxymanager'': ''80'', ''spoolman'': ''7912'', ''tinyauth'': ''3000''}.get(template, '''') >>'
  when: >-
    << not npm_proxy_enabled and configure_optional and (
      (template == 'changedetection' and 'public_privacy' in optional_groups) or
      (template == 'karakeep' and 'crawler' in optional_groups) or
      (template == 'nginxproxymanager' and 'network_behavior' in optional_groups) or
      (template == 'spoolman' and 'access' in optional_groups) or
      (template == 'tinyauth' and 'session_access' in optional_groups)
    ) >>

---
!include boilerplates/bambuddy/options.yml
---
!include boilerplates/changedetection/options.yml
---
!include boilerplates/cloudflared-web/options.yml
---
!include boilerplates/karakeep/options.yml
---
!include boilerplates/nginxproxymanager/options.yml
---
!include boilerplates/spoolman/options.yml
---
!include boilerplates/tinyauth/options.yml
