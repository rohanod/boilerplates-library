---
services:
  << service_name >>:
    image: docker.io/jc21/nginx-proxy-manager:2.15.1
    restart: << restart_policy >>
    env_file:
      - .env
    environment:
      - TZ=<< container_timezone >>
      - DISABLE_IPV6=<< disable_ipv6 | lower >>
      - IP_RANGES_FETCH_ENABLED=<< ip_ranges_fetch_enabled | lower >>
      - DISABLE_RESOLVER=<< disable_resolver | lower >>
      - X_FRAME_OPTIONS=<< x_frame_options >>
    volumes:
      <%- if volume_mode == 'mount' %>
      - << volume_mount_path >>/data:/data
      - << volume_mount_path >>/letsencrypt:/etc/letsencrypt
      <%- else %>
      - << service_name >>_data:/data
      - << service_name >>_letsencrypt:/etc/letsencrypt
      <%- endif %>
      <%- if custom_config_host_path %>
      - << custom_config_host_path >>:/data/nginx/custom:ro
      <%- endif %>
    ports:
      - "<< ports_http >>:80"
      - "<< ports_https >>:443"
      - "<< ports_admin >>:81"
    <%- if npm_proxy_enabled %>
    networks:
      - npm-proxy
    <%- endif %>

<%- if volume_mode == 'local' %>
volumes:
  << service_name >>_data:
    driver: local
  << service_name >>_letsencrypt:
    driver: local
<%- elif volume_mode == 'nfs' %>
volumes:
  << service_name >>_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=<< volume_nfs_server >>,nfsvers=4,<< volume_nfs_options >>
      device: ":<< volume_nfs_path >>/data"
  << service_name >>_letsencrypt:
    driver: local
    driver_opts:
      type: nfs
      o: addr=<< volume_nfs_server >>,nfsvers=4,<< volume_nfs_options >>
      device: ":<< volume_nfs_path >>/letsencrypt"
<%- endif %>

<%- if npm_proxy_enabled %>
networks:
  npm-proxy:
    name: << npm_proxy_network >>
    external: true
<%- endif %>
